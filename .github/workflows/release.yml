name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check tag matches plugin version
        run: grep -q "pluginVersion *= \"${GITHUB_REF_NAME#v}\"" internal/plugin/plugin.go
      - run: go vet ./...
      - run: go test -race ./...
      - run: node scripts/test-ui.cjs

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04, ext: so, image: quay.io/pypa/manylinux2014_x86_64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # manylinux2014 (glibc 2.17) keeps the plugin loadable on older Linux distributions.
      - name: Build Linux plugin
        if: matrix.os == 'linux'
        run: |
          mkdir -p dist
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/src" -w /src -v "$(go env GOROOT):/opt/go:ro" \
            -e GOROOT=/opt/go -e HOME=/tmp -e GOFLAGS=-buildvcs=false \
            ${{ matrix.image }} \
            /opt/go/bin/go build -trimpath -ldflags="-s -w" -tags cshared -buildmode=c-shared -o dist/cpa-codex-candy-eval.so ./cmd/cpa-codex-candy-eval


      - name: Verify Linux amd64 library
        run: |
          python3 - <<'PY'
          from pathlib import Path
          data = Path('dist/cpa-codex-candy-eval.so').read_bytes()
          assert data[:6] == b'\x7fELF\x02\x01'
          assert int.from_bytes(data[16:18], 'little') == 3
          assert int.from_bytes(data[18:20], 'little') == 62
          print('Verified linux/amd64 shared library')
          PY
      # The CPA plugin store needs <id>_<version>_<os>_<arch>.zip with the library at the zip root.
      - name: Package
        if: matrix.os != 'windows'
        run: |
          name="cpa-codex-candy-eval_${GITHUB_REF_NAME#v}_${{ matrix.os }}_${{ matrix.arch }}"
          tar -czf "$name.tar.gz" -C dist cpa-codex-candy-eval.${{ matrix.ext }}
          zip -j "$name.zip" dist/cpa-codex-candy-eval.${{ matrix.ext }}


      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: cpa-codex-candy-eval_*_${{ matrix.os }}_${{ matrix.arch }}.*
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: assets
        run: sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
